name: EOD Volume Scan

on:
  schedule:
    # 22:00 UTC on weekdays = ~6pm ET (after the US close, once EOD data settles).
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}   # allow manual "Run workflow" from the Actions tab

# peaceiris/actions-gh-pages pushes the built page to the gh-pages branch.
permissions:
  contents: write

# Serialize all publishes to gh-pages (shared with the intraday workflow) so two
# runs never push to the branch at the same time.
concurrency:
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r volume_scanner/requirements.txt

      - name: Run end-of-day scan and build the page
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: |
          python -m volume_scanner.cli \
            --source alpaca --market us \
            --min-rvol 3 --min-dollar-vol 1000000 \
            --earnings \
            --html site/index.html --out site/report.csv

      - name: Publish daily page to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true   # preserve the intraday page on the branch
